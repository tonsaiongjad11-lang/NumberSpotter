name: Build Thai Letter APK
on:
  push:
    branches: [thai-letter-highlight-apk]
    paths: ['thai-letter-app/**', '.github/workflows/thai-letter-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and lint
        working-directory: thai-letter-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Verify APK signature and package
        run: |
          APK=thai-letter-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: ThaiLetterHighlightAssistant-APK
          path: thai-letter-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Save downloadable APK on build branch
        run: |
          mkdir -p thai-apk-output
          cp thai-letter-app/app/build/outputs/apk/debug/app-debug.apk thai-apk-output/ThaiLetterHighlightAssistant.apk
          python3 - <<'PY'
          import pathlib,hashlib,json,base64
          p=pathlib.Path('thai-apk-output/ThaiLetterHighlightAssistant.apk')
          b=p.read_bytes()
          encoded=base64.b64encode(b).decode()
          parts=[]
          for i in range(0,len(encoded),120000):
              f=p.parent/('part-%03d.b64'%(i//120000))
              f.write_text(encoded[i:i+120000])
              parts.append(f.name)
          (p.parent/'manifest.json').write_text(json.dumps({'filename':p.name,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'parts':parts}))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai-apk-output
          git commit -m "Store verified Thai letter debug APK [skip ci]"
          git push origin HEAD:thai-letter-highlight-apk
